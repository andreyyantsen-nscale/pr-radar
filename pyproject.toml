[project]
name = "pr-radar"
version = "0.2.1"
description = "Terminal dashboard for your pending GitHub pull requests"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-*"]
authors = [
    { name = "Andrey Yantsen", email = "andrey.yantsen@nscale.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pr-radar = "pr_radar:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
